version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: ms-email-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms-email
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: